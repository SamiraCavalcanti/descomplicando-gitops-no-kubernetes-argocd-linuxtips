apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: giropops-senhas
  namespace: argocd

spec:
  project: default
  sources:
    - repoURL: 'https://grafana.github.io/helm-charts'
      chart: grafana
      targetRevision: 8.5.0
      helm:
        valueFiles:
          - $values/grafana/values.yaml
    - repoURL: 'https://github.com/SamiraCavalcanti/descomplicando-gitops-no-kubernetes-argocd-linuxtips.git'
      targetRevision: feat/day2
      ref: values

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: giropops-senhas

  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true