apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/SamiraCavalcanti/descomplicando-gitops-no-kubernetes-argocd-linuxtips.git'
    targetRevision: feat/day2
    path: app-of-apps
    helm:
       parameters:
        - name: argocd.giropopsSenhas.enabled
          value: 'true'
        - name: argocd.randomLogger.enabled
          value: 'true'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy: 
    automated: 
      selfHeal: true
      prune: true
  
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
       